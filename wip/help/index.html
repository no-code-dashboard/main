<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>No-code-dashboard Help</title>
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <style>
    th,
    td {
      text-align: left;
    }
    p,
    table,
    h1,
    h2 {
      padding-bottom: 0.5rem;
    }
    
    code {
      background-color: hsl(from var(--color-brand) h s l / 0.1);
      font-family: monospace, monospace;
    }
    img {
      width: 50%;
      min-width: 300px;
    }
  </style>
  <body>
    <div id="content"></div>
    <footer></footer>
  </body>
  <script type="module">
    import { addFooter } from "../js/modules/footer.js";
    addFooter();

    import { markdownToHtml } from "../js/modules/markdown.js";

    fetch("./help.md")
      .then((response) => response.text())
      .then((text) => {
        // console.log(text)
        var content = markdownToHtml(text); //marked.parse(result);
        document.querySelector("#content").innerHTML = content;
      });
  </script>
</html>
